name: Pull Request Compile Check

on:
  pull_request:
    branches:
      - dev    # Only triggers when the PR's TARGET branch is "dev"

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'Corretto'
          cache: maven

      - name: Compile with Maven
        run: mvn compile --batch-mode
